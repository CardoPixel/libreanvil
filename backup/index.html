    <!-- Import/Export Modal -->
    <div id="importExportModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">

    <!-- Service Worker Registration -->
    <script>
        // Check if the browser supports service workers
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installConfirm = document.getElementById('installConfirm');
        const installCancel = document.getElementById('installCancel');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installPrompt.classList.remove('hidden');
        });

        installConfirm.addEventListener('click', () => {
            installPrompt.classList.add('hidden');
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
            });
        });

        installCancel.addEventListener('click', () => {
            installPrompt.classList.add('hidden');
        });
    </script>

    <!-- Main App Script -->
    <script>
        // Dark mode toggle
        const toggleDarkMode = document.getElementById('toggleDarkMode');
        const darkIcon = document.getElementById('darkIcon');
        const lightIcon = document.getElementById('lightIcon');

        // Check for saved theme preference or use system preference
        if (localStorage.getItem('darkMode') === 'true' ||
            (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            darkIcon.classList.add('hidden');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
            lightIcon.classList.add('hidden');
        }

        toggleDarkMode.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
        });

        // Initialize Leaflet map
        let map = L.map('map').setView([0, 0], 2);
        let currentProject = null;
        let layers = {};
        let markers = [];
        let polygons = [];
        let polylines = [];
        let notes = [];
        let characters = [];
        let locations = [];
        let organizations = [];
        let events = [];
        let currentEditor = null;

        // Sidebar toggle functionality
        const toggleButtons = {
            maps: document.getElementById('toggleMaps'),
            characters: document.getElementById('toggleCharacters'),
            locations: document.getElementById('toggleLocations'),
            organizations: document.getElementById('toggleOrganizations'),
            events: document.getElementById('toggleEvents')
        };

        const panels = {
            maps: document.getElementById('mapsPanel'),
            characters: document.getElementById('charactersPanel'),
            locations: document.getElementById('locationsPanel'),
            organizations: document.getElementById('organizationsPanel'),
            events: document.getElementById('eventsPanel')
        };

        Object.keys(toggleButtons).forEach(key => {
            toggleButtons[key].addEventListener('click', () => {
                const icon = toggleButtons[key].querySelector('svg');
                icon.classList.toggle('rotate-180');
                panels[key].classList.toggle('hidden');
            });
        });

        // Modal functionality
        const modals = {
            newProject: document.getElementById('newProjectModal'),
            newLayer: document.getElementById('newLayerModal'),
            characterEditor: document.getElementById('characterEditorModal'),
            importExport: document.getElementById('importExportModal')
        };

        const openModalButtons = {
            newProject: document.getElementById('newProjectBtn'),
            newLayer: document.getElementById('addLayerBtn'),
            characterEditor: document.getElementById('newCharacterBtn'),
            import: document.getElementById('importBtn'),
            export: document.getElementById('exportBtn')
        };

        const closeModalButtons = {
            newProject: document.getElementById('closeNewProjectModal'),
            newLayer: document.getElementById('closeNewLayerModal'),
            characterEditor: document.getElementById('closeCharacterEditor'),
            importExport: document.getElementById('closeImportExportModal')
        };

        // Open modals
        openModalButtons.newProject.addEventListener('click', () => {
            modals.newProject.classList.remove('hidden');
        });

        openModalButtons.newLayer.addEventListener('click', () => {
            modals.newLayer.classList.remove('hidden');
        });

        openModalButtons.characterEditor.addEventListener('click', () => {
            modals.characterEditor.classList.remove('hidden');
            currentEditor = { type: 'character', id: null };
            resetCharacterForm();
        });

        openModalButtons.import.addEventListener('click', () => {
            modals.importExport.classList.remove('hidden');
            document.getElementById('importExportTitle').textContent = 'Import Project';
            document.getElementById('importExportContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label for="importFile" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Project File</label>
                        <input type="file" id="importFile" accept=".libreanvil,.zip" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700">
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button id="cancelImport" class="px-4 py-2 bg-gray-300 dark:bg-gray-600 rounded-md hover:bg-gray-400 dark:hover:bg-gray-500">Cancel</button>
                        <button id="confirmImport" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Import</button>
                    </div>
                </div>
            `;

            document.getElementById('cancelImport').addEventListener('click', () => {
                modals.importExport.classList.add('hidden');
            });

            document.getElementById('confirmImport').addEventListener('click', () => {
                const fileInput = document.getElementById('importFile');
                if (fileInput.files.length > 0) {
                    importProject(fileInput.files[0]);
                    modals.importExport.classList.add('hidden');
                } else {
                    alert('Please select a file to import');
                }
            });
        });

        openModalButtons.export.addEventListener('click', () => {
            if (!currentProject) {
                alert('No project loaded to export');
                return;
            }

            modals.importExport.classList.remove('hidden');
            document.getElementById('importExportTitle').textContent = 'Export Project';
            document.getElementById('importExportContent').innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label for="exportFileName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">File Name</label>
                        <input type="text" id="exportFileName" value="${currentProject.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="includeImages" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600">
                        <label for="includeImages" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Include images in export</label>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button id="cancelExport" class="px-4 py-2 bg-gray-300 dark:bg-gray-600 rounded-md hover:bg-gray-400 dark:hover:bg-gray-500">Cancel</button>
                        <button id="confirmExport" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Export</button>
                    </div>
                </div>
            `;

            document.getElementById('cancelExport').addEventListener('click', () => {
                modals.importExport.classList.add('hidden');
            });

            document.getElementById('confirmExport').addEventListener('click', () => {
                const fileName = document.getElementById('exportFileName').value || 'libreanvil_project';
                const includeImages = document.getElementById('includeImages').checked;
                exportProject(fileName, includeImages);
                modals.importExport.classList.add('hidden');
            });
        });

        // Close modals
        Object.keys(closeModalButtons).forEach(key => {
            closeModalButtons[key].addEventListener('click', () => {
                modals[key].classList.add('hidden');
            });
        });

        // Cancel buttons
        document.getElementById('cancelNewProject').addEventListener('click', () => {
            modals.newProject.classList.add('hidden');
        });

        document.getElementById('cancelNewLayer').addEventListener('click', () => {
            modals.newLayer.classList.add('hidden');
        });

        document.getElementById('cancelCharacterEdit').addEventListener('click', () => {
            modals.characterEditor.classList.add('hidden');
        });

        // Create buttons
        document.getElementById('createProject').addEventListener('click', () => {
            const projectName = document.getElementById('projectName').value;
            const baseMapFile = document.getElementById('baseMap').files[0];

            if (!projectName) {
                alert('Please enter a project name');
                return;
            }

            if (!baseMapFile) {
                alert('Please select a base map image');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const imageUrl = e.target.result;
                createNewProject(projectName, imageUrl);
                modals.newProject.classList.add('hidden');
            };
            reader.readAsDataURL(baseMapFile);
        });

        document.getElementById('createLayer').addEventListener('click', () => {
            const layerName = document.getElementById('layerName').value;
            const layerType = document.getElementById('layerType').value;

            if (!layerName) {
                alert('Please enter a layer name');
                return;
            }

            if (layerType === 'image') {
                const layerImageFile = document.getElementById('layerImage').files[0];
                if (!layerImageFile) {
                    alert('Please select an image for the layer');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (e) {
                    const imageUrl = e.target.result;
                    createNewLayer(layerName, layerType, imageUrl);
                    modals.newLayer.classList.add('hidden');
                };
                reader.readAsDataURL(layerImageFile);
            } else {
                createNewLayer(layerName, layerType);
                modals.newLayer.classList.add('hidden');
            }
        });

        document.getElementById('saveCharacter').addEventListener('click', () => {
            saveCharacter();
            modals.characterEditor.classList.add('hidden');
        });

        // Layer type change
        document.getElementById('layerType').addEventListener('change', (e) => {
            const layerImageContainer = document.getElementById('layerImageContainer');
            if (e.target.value === 'image') {
                layerImageContainer.classList.remove('hidden');
            } else {
                layerImageContainer.classList.add('hidden');
            }
        });

        // Markdown preview for character description
        document.getElementById('characterDescription').addEventListener('input', (e) => {
            document.getElementById('characterPreview').innerHTML = marked.parse(e.target.value);
        });

        // Close editor panel
        document.getElementById('closeEditorBtn').addEventListener('click', () => {
            document.getElementById('editorPanel').classList.add('hidden');
        });

        // Map drawing controls
        document.getElementById('drawMarkerBtn').addEventListener('click', () => {
            alert('Marker drawing mode activated. Click on the map to place a marker.');
            // In a full implementation, this would activate Leaflet.draw's marker drawing mode
        });

        document.getElementById('drawPolygonBtn').addEventListener('click', () => {
            alert('Polygon drawing mode activated. Click on the map to start drawing a polygon.');
            // In a full implementation, this would activate Leaflet.draw's polygon drawing mode
        });

        document.getElementById('drawLineBtn').addEventListener('click', () => {
            alert('Line drawing mode activated. Click on the map to start drawing a line.');
            // In a full implementation, this would activate Leaflet.draw's line drawing mode
        });

        document.getElementById('addNoteBtn').addEventListener('click', () => {
            alert('Note mode activated. Click on the map to add a note.');
            // In a full implementation, this would activate a custom note placement mode
        });

        // Project functions
        function createNewProject(name, baseMapImage) {
            currentProject = {
                id: Date.now().toString(),
                name: name,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                baseMap: baseMapImage
            };

            // Clear previous data
            layers = {};
            markers = [];
            polygons = [];
            polylines = [];
            notes = [];
            characters = [];
            locations = [];
            organizations = [];
            events = [];

            // Update UI
            updateProjectUI();

            // Set up the map with the new base image
            map.eachLayer(layer => map.removeLayer(layer));

            const imageBounds = [[-90, -180], [90, 180]]; // Default bounds, would need adjustment for custom images
            L.imageOverlay(baseMapImage, imageBounds).addTo(map);
            map.fitBounds(imageBounds);

            // Add to maps list
            addMapToList(currentProject);

            // Save to localStorage
            saveToLocalStorage();
        }

        function updateProjectUI() {
            document.title = `${currentProject.name} - LibreAnvil`;
            // Update other UI elements as needed
        }

        function addMapToList(project) {
            const mapsPanel = document.getElementById('mapsPanel');
            const mapElement = document.createElement('div');
            mapElement.className = 'flex items-center justify-between px-3 py-2 bg-gray-100 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 cursor-pointer';
            mapElement.innerHTML = `
                <span>${project.name}</span>
                <div class="flex space-x-1">
                    <button class="p-1 text-blue-600 hover:text-blue-800 dark:hover:text-blue-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                    </button>
                    <button class="p-1 text-red-600 hover:text-red-800 dark:hover:text-red-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            `;

            mapElement.querySelector('span').addEventListener('click', () => {
                loadProject(project);
            });

            mapsPanel.appendChild(mapElement);
        }

        function loadProject(project) {
            currentProject = project;
            updateProjectUI();

            // Clear the map
            map.eachLayer(layer => map.removeLayer(layer));

            // Load base map
            const imageBounds = [[-90, -180], [90, 180]]; // Default bounds, would need adjustment for custom images
            L.imageOverlay(project.baseMap, imageBounds).addTo(map);
            map.fitBounds(imageBounds);

            // Load other layers and elements
            // This would be more comprehensive in a full implementation
        }

        function createNewLayer(name, type, imageUrl = null) {
            const layerId = Date.now().toString();

            layers[layerId] = {
                id: layerId,
                name: name,
                type: type,
                visible: true,
                createdAt: new Date().toISOString(),
                imageUrl: imageUrl
            };

            // Add to map if it's an image layer
            if (type === 'image' && imageUrl) {
                const imageBounds = [[-90, -180], [90, 180]]; // Default bounds
                const layer = L.imageOverlay(imageUrl, imageBounds).addTo(map);
                layers[layerId].leafletLayer = layer;
            }

            // Update UI
            updateLayersUI();
            saveToLocalStorage();
        }

        function updateLayersUI() {
            // This would update the layers control panel in a full implementation
        }

        function resetCharacterForm() {
            document.getElementById('characterName').value = '';
            document.getElementById('characterRace').value = '';
            document.getElementById('characterClass').value = '';
            document.getElementById('characterDescription').value = '';
            document.getElementById('characterPreview').innerHTML = '';
            document.getElementById('characterImage').value = '';
        }

        function saveCharacter() {
            const name = document.getElementById('characterName').value;
            const race = document.getElementById('characterRace').value;
            const charClass = document.getElementById('characterClass').value;
            const description = document.getElementById('characterDescription').value;
            const imageFile = document.getElementById('characterImage').files[0];

            if (!name) {
                alert('Please enter a character name');
                return;
            }

            let imageUrl = null;
            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imageUrl = e.target.result;
                    completeSaveCharacter(name, race, charClass, description, imageUrl);
                };
                reader.readAsDataURL(imageFile);
            } else {
                completeSaveCharacter(name, race, charClass, description, imageUrl);
            }
        }

        function completeSaveCharacter(name, race, charClass, description, imageUrl) {
            if (currentEditor.id) {
                // Update existing character
                const index = characters.findIndex(c => c.id === currentEditor.id);
                if (index !== -1) {
                    characters[index] = {
                        ...characters[index],
                        name,
                        race,
                        charClass,
                        description,
                        imageUrl: imageUrl || characters[index].imageUrl,
                        updatedAt: new Date().toISOString()
                    };
                }
            } else {
                // Create new character
                const newCharacter = {
                    id: Date.now().toString(),
                    name,
                    race,
                    charClass,
                    description,
                    imageUrl,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                characters.push(newCharacter);
            }

            // Update UI
            updateCharactersUI();
            saveToLocalStorage();
        }

        function updateCharactersUI() {
            // This would update the characters list in the sidebar in a full implementation
        }

        function exportProject(fileName, includeImages) {
            const projectData = {
                project: currentProject,
                layers: layers,
                markers: markers,
                polygons: polygons,
                polylines: polylines,
                notes: notes,
                characters: characters,
                locations: locations,
                organizations: organizations,
                events: events
            };

            const zip = new JSZip();
            zip.file('project.json', JSON.stringify(projectData));

            if (includeImages) {
                // Add images to the zip
                // This would be more comprehensive in a full implementation
                if (currentProject.baseMap) {
                    const baseMapData = currentProject.baseMap.split(',')[1];
                    zip.file('baseMap.png', baseMapData, { base64: true });
                }
            }

            zip.generateAsync({ type: 'blob' }).then(content => {
                saveAs(content, `${fileName}.libreanvil`);
            });
        }

        function importProject(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const zip = new JSZip();
                zip.loadAsync(e.target.result).then(zip => {
                    return zip.file('project.json').async('text');
                }).then(text => {
                    const projectData = JSON.parse(text);

                    // Load the project
                    currentProject = projectData.project;
                    layers = projectData.layers || {};
                    markers = projectData.markers || [];
                    polygons = projectData.polygons || [];
                    polylines = projectData.polylines || [];
                    notes = projectData.notes || [];
                    characters = projectData.characters || [];
                    locations = projectData.locations || [];
                    organizations = projectData.organizations || [];
                    events = projectData.events || [];

                    // Update UI
                    updateProjectUI();

                    // Set up the map with the base image
                    map.eachLayer(layer => map.removeLayer(layer));

                    if (currentProject.baseMap) {
                        const imageBounds = [[-90, -180], [90, 180]]; // Default bounds
                        L.imageOverlay(currentProject.baseMap, imageBounds).addTo(map);
                        map.fitBounds(imageBounds);
                    }

                    // Add to maps list if not already there
                    if (!document.querySelector(`[data-project-id="${currentProject.id}"]`)) {
                        addMapToList(currentProject);
                    }

                    // Save to localStorage
                    saveToLocalStorage();
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function saveToLocalStorage() {
            if (!currentProject) return;

            const projectData = {
                project: currentProject,
                layers: layers,
                markers: markers,
                polygons: polygons,
                polylines: polylines,
                notes: notes,
                characters: characters,
                locations: locations,
                organizations: organizations,
                events: events
            };

            localStorage.setItem('libreanvil_current_project', JSON.stringify(projectData));

            // Also save to list of projects
            const projects = JSON.parse(localStorage.getItem('libreanvil_projects')) || [];
            const existingIndex = projects.findIndex(p => p.id === currentProject.id);

            if (existingIndex !== -1) {
                projects[existingIndex] = currentProject;
            } else {
                projects.push(currentProject);
            }

            localStorage.setItem('libreanvel_projects', JSON.stringify(projects));
        }

        function loadFromLocalStorage() {
            const projectData = JSON.parse(localStorage.getItem('libreanvil_current_project'));
            if (projectData) {
                currentProject = projectData.project;
                layers = projectData.layers || {};
                markers = projectData.markers || [];
                polygons = projectData.polygons || [];
                polylines = projectData.polylines || [];
                notes = projectData.notes || [];
                characters = projectData.characters || [];
                locations = projectData.locations || [];
                organizations = projectData.organizations || [];
                events = projectData.events || [];

                updateProjectUI();

                // Set up the map with the base image
                map.eachLayer(layer => map.removeLayer(layer));

                if (currentProject.baseMap) {
                    const imageBounds = [[-90, -180], [90, 180]]; // Default bounds
                    L.imageOverlay(currentProject.baseMap, imageBounds).addTo(map);
                    map.fitBounds(imageBounds);
                }

                // Load projects list
                const projects = JSON.parse(localStorage.getItem('libreanvil_projects')) || [];
                projects.forEach(project => {
                    addMapToList(project);
                });
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();

            // Add default controls to the map
            L.control.scale().addTo(map);

            // Add a simple base layer if no project is loaded
            if (!currentProject) {
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
            }
        });
    </script>
